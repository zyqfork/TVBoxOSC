name: build-tvbox

on:
  schedule:
    - cron: 0 20 * * *
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略构建记录以重新构建'
        required: false
        type: boolean
      donotpublish:
        description: '只构建，不发布 release、不更新 README'
        required: false
        type: boolean

# 定时任务和手动触发不重叠，避免两轮同时推 README
concurrency:
  group: build-tvbox
  cancel-in-progress: false

permissions:
  contents: write # 推 README、创建/删除 release
  actions: write  # 清理旧的 workflow run

env:
  # 现役目标的 tag 前缀。目标一旦从这里消失，它的历史 release 就再也不会被
  # 各 build 任务自己的 prune 碰到（那些只认自己的前缀），会永久占着体积。
  # cleanup 任务靠这份白名单回收这类失联 release。
  # !! 增删 matrix 目标时必须同步这里，否则新目标的 release 会在下一轮被回收 !!
  RELEASE_PREFIXES: |
    q215613905_TVBoxOS_main_
    takagen99_Box_main_
    zyqfork_TV_release_

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: q215613905
            repoName: TVBoxOS
            branchName: main
          - userName: takagen99
            repoName: Box
            branchName: main
          # fork=true：从源码构建（media3compat 要用 NDK 编 libmpv/ffmpeg/dav1d），
          # 且自带 signingConfigs，不需要注入签名配置
          - userName: zyqfork
            repoName: TV
            branchName: release
            fork: true
          # 注意：改动上面三个目标后，记得同步顶层 env.RELEASE_PREFIXES

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 只有上游有新提交（且 README 里还没记录）才继续；否则后面所有步骤都会因为 env.commit 为空而跳过
      - name: Resolve upstream commit
        run: |
          upStream=https://github.com/${{ matrix.userName }}/${{ matrix.repoName }}
          echo "upStream=$upStream" >> "$GITHUB_ENV"

          commit=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ matrix.userName }}/${{ matrix.repoName }}/commits/${{ matrix.branchName }}" \
            | jq -r '.sha // empty')

          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "拿不到有效 commit（'${commit}'），跳过本轮"
            exit 0
          fi
          if grep -q "$commit" README.md && [ "${{ inputs.rebuild }}" != "true" ]; then
            echo "commit ${commit:0:7} 已构建过，跳过本轮"
            exit 0
          fi

          {
            echo "commit=$commit"
            echo "commitS=${commit:0:7}"
          } >> "$GITHUB_ENV"

      - name: Clone source
        if: ${{ env.commit }}
        run: |
          git clone --recurse-submodules "${{ env.upStream }}" src
          cd src
          git checkout "${{ env.commit }}"
          git submodule update --init --recursive
          echo "tag=$(git log --date=format:'%Y%m%d-%H%M' --pretty=format:%cd -1 "${{ env.commit }}")" >> "$GITHUB_ENV"

      - name: Cache Media3 mavenLocal
        if: ${{ env.commit && matrix.fork }}
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: media3-maven-${{ runner.os }}-${{ hashFiles('scripts/build-fongmi-media3.sh') }}
          restore-keys: |
            media3-maven-${{ runner.os }}-

      - name: Publish Media3 to mavenLocal
        if: ${{ env.commit && matrix.fork }}
        run: |
          chmod +x scripts/build-fongmi-media3.sh
          scripts/build-fongmi-media3.sh "${{ github.workspace }}"

      - name: Setup Python 3.10
        if: ${{ env.commit }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # 各上游的 Chaquopy/Pyramid 需要把 buildPython 指到 CI 的 python3.10
      - name: Patch upstream sources
        if: ${{ env.commit && !matrix.fork }}
        working-directory: src
        run: |
          set -euo pipefail
          python_path="$(which python3.10)"

          if [ "${{ matrix.repoName }}" = "Box" ]; then
            chmod +x ../scripts/patch-box-python.py
            python3 ../scripts/patch-box-python.py "$python_path"
          fi

          if [ "${{ matrix.repoName }}" = "TVBoxOS" ] && [ -f pyramid/build.gradle ]; then
            if grep -q buildPython pyramid/build.gradle; then
              sed -i "s|buildPython(\".*\")|buildPython(\"$python_path\")|g" pyramid/build.gradle
            else
              sed -i "/python {/a\            buildPython \"$python_path\"" pyramid/build.gradle
            fi
          fi

      # zyqfork/TV 自带 signingConfigs + local.properties，其余上游注入一套
      - name: Prepare signing
        if: ${{ env.commit }}
        working-directory: src
        run: |
          cp -f "${{ github.workspace }}/.github/workflows/TVBoxOSC.jks" app/TVBoxOSC.jks

          if [ -n "${{ matrix.fork }}" ]; then
            echo "zyqfork/TV 使用原生 signingConfigs + local.properties，跳过注入"
            exit 0
          fi

          signingConfigs=''
          signingConfig='ICAgICAgICAgICAgaWYgKHByb2plY3QuaGFzUHJvcGVydHkoIlJFTEVBU0VfU1RPUkVfRklMRSIpKSB7XAogICAgICAgICAgICAgICAgc2lnbmluZ0NvbmZpZyA9IHNpZ25pbmdDb25maWdzLm15Q29uZmlnXAogICAgICAgICAgICB9XAo='
          signingConfigs="$(echo "$signingConfigs" | base64 -d)"
          signingConfig="$(echo "$signingConfig" | base64 -d)"
          sed -i -e "/defaultConfig {/i\\$signingConfigs " -e "/debug {/a\\$signingConfig " -e "/release {/a\\$signingConfig " app/build.gradle
          sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks' ./gradle.properties
          sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC' ./gradle.properties
          sed -i '$a\RELEASE_STORE_PASSWORD=TVBoxOSC' ./gradle.properties
          sed -i '$a\RELEASE_KEY_PASSWORD=TVBoxOSC' ./gradle.properties

      - name: Setup JDK 17
        if: ${{ env.commit }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: ${{ env.commit }}
        uses: gradle/actions/setup-gradle@v5

      - name: Write local.properties
        if: ${{ env.commit }}
        working-directory: src
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "${{ matrix.fork }}" ]; then
            {
              echo "storeFile=./TVBoxOSC.jks"
              echo "keyAlias=TVBoxOSC"
              echo "storePassword=TVBoxOSC"
            } >> local.properties
          fi

      - name: Cache native libraries
        if: ${{ env.commit && matrix.fork }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/fongmi-libmpv
            ~/.gradle/caches/fongmi-ffmpeg-arm64-v8a
            ~/.gradle/caches/fongmi-ffmpeg-armeabi-v7a
            ~/.gradle/caches/fongmi-dav1d
          key: native-${{ runner.os }}-${{ hashFiles('src/media3compat/scripts/*.sh', 'src/media3compat/build.gradle') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Cache Gradle dependencies
        if: ${{ env.commit }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-3
            ~/.gradle/caches/journal-1
          key: gradle-deps-${{ matrix.repoName }}-${{ runner.os }}-${{ hashFiles('src/**/*.gradle*', 'src/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-${{ matrix.repoName }}-${{ runner.os }}-

      - name: Setup Android SDK
        if: ${{ env.commit && matrix.fork }}
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK toolchains
        if: ${{ env.commit && matrix.fork }}
        run: |
          # media3compat 源码构建 dav1d/mpv/ffmpeg 需要 NDK 26.1/29 + cmake
          sdkmanager "ndk;26.1.10909125" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build with Gradle
        if: ${{ env.commit }}
        working-directory: src
        run: |
          chmod +x gradlew
          # 有些上游的 gradle.properties 末尾没有换行，直接 >> 会和最后一行粘连
          printf '\n' >> gradle.properties
          for prop in "org.gradle.daemon=true" "org.gradle.parallel=true" "org.gradle.caching=true"; do
            key="${prop%%=*}"
            if grep -q "^${key}=" gradle.properties; then
              sed -i "s|^${key}=.*|${prop}|" gradle.properties
            else
              echo "${prop}" >> gradle.properties
            fi
          done

          if [ -n "${{ matrix.fork }}" ]; then
            # 这些 APK 有 70-90MB，zipflinger 打包时会把条目整个读进堆，而 gradle.properties
            # 里钉的是 2G —— 并行打包下会以 OutOfMemoryError: Java heap space 让
            # package*Release 失败（曾经在 packageLeanbackArmeabi_v7aRelease 上翻车）。
            # fork 自己的 source-build.yml 也是为此刻意抬到 8G，这里保持一致。
            JVMARGS="-Xmx8192m -Dfile.encoding=UTF-8 --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED"
            sed -i 's|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs='"$JVMARGS"'|' gradle.properties
            grep -n 'org.gradle.jvmargs' gradle.properties

            # media3compat 按 FONGMI_NATIVE_ABIS 决定给哪些 ABI 编原生库；
            # 按 ABI 分两次编，一次 assemblerelease 会触发 mergeJavaRes 压缩信息错误。
            # --no-daemon：两次调用各起一个单次 JVM，避免第二个 ABI 接着用第一个攒下来的堆。
            FONGMI_NATIVE_ABIS=arm64-v8a ./gradlew \
              assembleLeanbackArm64_v8aRelease assembleMobileArm64_v8aRelease \
              --build-cache --max-workers=2 --no-daemon --stacktrace \
              -Dorg.gradle.jvmargs="$JVMARGS"
            FONGMI_NATIVE_ABIS=armeabi-v7a ./gradlew \
              assembleLeanbackArmeabi_v7aRelease assembleMobileArmeabi_v7aRelease \
              --build-cache --max-workers=2 --no-daemon --stacktrace \
              -Dorg.gradle.jvmargs="$JVMARGS"
          else
            ./gradlew assemblerelease --build-cache --parallel --daemon --stacktrace
          fi

      # 收集 APK 并生成 release 说明。APK 只发到 GitHub Release，不再往 gh-pages 部署。
      - name: Prepare release assets
        if: ${{ env.commit }}
        working-directory: src
        run: |
          set -euo pipefail
          rm -rf apk && mkdir -p apk

          # 各上游的输出路径不同（有的 flavor 就叫 *_release），统一用 find 兜住
          while IFS= read -r -d '' file; do
            cp "$file" "apk/${{ matrix.userName }}-${{ matrix.repoName }}-${{ matrix.branchName }}-${file##*/}"
          done < <(find . -type d -iname release -exec find {} -type f -name '*.apk' -print0 \;)

          # release 说明 = 相对上次已构建提交的提交列表
          last=$(grep -F "[${{ matrix.userName }}/${{ matrix.repoName }}]" ../README.md \
            | grep -F "${{ matrix.branchName }}" | grep -o '[0-9a-f]\{40\}' | head -1 || true)
          git rev-parse --verify "${last:-none}" >/dev/null 2>&1 || last="${{ env.commit }}"

          {
            echo "Credit: [${{ matrix.userName }}](${{ env.upStream }})"
            echo "Commit: ${{ env.commit }}"
            # tag 里的时间是上游 commit 的提交时间，同一 commit 重跑会就地覆盖同一
            # release，所以 tag 看不出构建时间，这里补一行真实的构建时间
            echo "Built at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo '```'
            if [ "$last" = "${{ env.commit }}" ]; then
              git log -1 --pretty=format:'- %s' "${{ env.commitS }}"
            else
              git log --no-merges --pretty=format:'- %s' "${last:0:7}..${{ env.commitS }}"
            fi
            echo
            echo '```'
          } > "apk/${{ matrix.userName }}-Release.log"

          # 每个 APK 的校验和，方便下载后核对完整性（sha256sum -c SHA256SUMS）
          ( cd apk && sha256sum ./*.apk > SHA256SUMS )

          echo "=== assets ==="
          ls -l apk/
          echo "=== changelog ==="
          cat "apk/${{ matrix.userName }}-Release.log"
          echo "=== SHA256SUMS ==="
          cat apk/SHA256SUMS

      - name: Publish release
        if: ${{ env.commit && !inputs.donotpublish }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}_${{ env.tag }}
          tag: ${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}_${{ env.tag }}
          bodyFile: src/apk/${{ matrix.userName }}-Release.log
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            src/apk/*.apk
            src/apk/SHA256SUMS

      # 只处理本目标自己的 tag，保留最新 2 个（当前 + 上一个），其余连 tag 一起删。
      # 这些 release 只是"某上游某次构建"的镜像，不是版本发布，留 2 个足够回滚。
      - name: Prune old releases
        if: ${{ env.commit && !inputs.donotpublish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          entries=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}_")) | "\(.id) \(.tag_name)"')

          kept=0
          while read -r id tag; do
            [ -n "${id:-}" ] || continue
            kept=$((kept + 1))
            [ "$kept" -le 2 ] && continue
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" >/dev/null
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" >/dev/null
            echo "已删除旧 release: $tag"
          done <<< "$entries"
          echo "共 $kept 个 release，保留最新 2 个"

      - name: Record build in README
        if: ${{ env.commit && !inputs.donotpublish }}
        run: |
          rm -rf src
          sed -i '/url =/d' ./.git/config
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url --add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

          current_time=$(date '+%Y-%m-%d %H:%M:%S')

          # 三个 matrix 任务会并发推同一分支：必须重试，且不能用 -f（-f 会覆盖其他任务的更新）
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase --autostash origin master; then
              git rebase --abort 2>/dev/null || true
              echo "第 ${attempt} 次 pull --rebase 失败，重试"
              sleep $((attempt * 5))
              continue
            fi

            python3 scripts/update-readme.py README.md \
              "${{ matrix.userName }}/${{ matrix.repoName }}" \
              "${{ matrix.branchName }}" \
              "${{ env.commit }}" \
              "$current_time"

            git add README.md
            git commit -m "Update ${{ matrix.userName }}/${{ matrix.repoName }} to ${{ env.commit }} at ${current_time}" || true

            if git push origin master; then
              echo "已推送到 master（第 ${attempt} 次尝试）"
              exit 0
            fi
            echo "第 ${attempt} 次 push 失败，重试"
            sleep $((attempt * 5))
          done
          echo "::error::README 更新重试 5 次后仍失败"

  # build 里的 prune 只认自己的前缀，目标一旦从 matrix 移除，它的历史 release 就永久
  # 失联——不会被更新，也不会被删。这个任务按白名单回收这类孤儿。
  # 与 build 串行（needs），避免和正在发布的 release 抢；即使 build 全跳过/失败也照跑。
  cleanup:
    needs: build
    if: ${{ always() && !inputs.donotpublish }}
    runs-on: ubuntu-latest
    steps:
      - name: Prune orphaned releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          readarray -t keep <<< "${RELEASE_PREFIXES:-}"

          removed=0
          while read -r id tag; do
            [ -n "${id:-}" ] || continue

            orphan=1
            for p in "${keep[@]}"; do
              [ -n "$p" ] || continue
              if [[ "$tag" == "$p"* ]]; then orphan=0; break; fi
            done
            [ "$orphan" -eq 0 ] && continue

            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" >/dev/null
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" >/dev/null
            echo "已回收失联 release: $tag"
            removed=$((removed + 1))
          done < <(gh api "repos/${{ github.repository }}/releases?per_page=100" \
                     --jq '.[] | "\(.id) \(.tag_name)"')

          echo "共回收 $removed 个失联 release"

  clean:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Delete old workflow runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          ids=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq "[.workflow_runs[] | select(.created_at < \"$cutoff\") | .id] | .[3:][]")
          count=0
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" >/dev/null && count=$((count + 1))
          done
          echo "已删除 $count 个旧运行"
